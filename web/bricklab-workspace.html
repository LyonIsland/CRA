<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}} · 机械臂搭建</title>
<style>body{margin:0;background:#edf2f6;color:#22394d;font:15px system-ui}header{padding:16px 24px;background:white;border-bottom:1px solid #d9e1e9;display:flex;align-items:center;gap:24px}h1{font-size:20px;margin:0}a{color:#215b91}main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;height:calc(100vh - 104px)}section{min-width:0;background:white;border-radius:12px;overflow:hidden;border:1px solid #dae3ed;display:flex;flex-direction:column}section h2{font-size:15px;margin:0;padding:12px 16px;border-bottom:1px solid #edf0f4}iframe{width:100%;flex:1;border:0}#viewer{height:360px;min-height:250px;background:#152334;position:relative}#viewer canvas{display:block;width:100%;height:100%}#wrist{width:100%;height:360px;object-fit:contain;background:#152334;display:none}.recording #viewer{display:none}.recording #wrist{display:block}#controls{padding:12px 16px}button{cursor:pointer;background:#f1f5f9;border:1px solid #c9d5e0;border-radius:6px;padding:8px 12px;color:#23415f}button:disabled{opacity:.45;cursor:default}.primary{background:#245f96;color:white;border-color:#245f96}nav{display:flex;flex-wrap:wrap;gap:8px}.joint{display:flex;justify-content:space-between;align-items:center;gap:8px}#joints{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;margin:12px 0}.joint button{padding:5px 14px}#status,#capability{line-height:1.6;margin:10px 0}#capability{color:#63798b}#wrist-mini{width:128px;height:96px;position:absolute;right:12px;bottom:12px;border:2px solid white;border-radius:5px}#record-status{font-size:13px;color:#526c82}#view-buttons{padding:8px 16px;border-bottom:1px solid #edf0f4}@media(max-width:1000px){main{grid-template-columns:1fr;height:auto}section{min-height:600px}iframe{height:650px;flex:auto}}</style>
<script type="importmap">{"imports":{"three":"/workspace-assets/three.module.js"}}</script></head>
<body data-job="{{JOB_ID}}"><style>.recording #viewer{display:none!important}.recording #wrist{display:block!important}</style><header><a href="/">← 继续设计</a><h1>{{TITLE}}</h1><span>{{PART_COUNT}} 件积木 · 单路相机感知</span><a href="/grasp-report/" target="_blank" rel="noopener">基础抓取验收</a></header>
<main><section><h2>本作品说明书</h2><iframe title="同一模型生成的说明书" src="/files/{{JOB_ID}}/task/policy/manual.pdf"></iframe></section>
<section id="robot-panel"><h2>本作品的机械臂搭建场景</h2><nav id="view-buttons"><button id="view-scene">机械臂场景</button><button id="view-wrist">腕部相机</button></nav>
<div id="viewer"><img id="wrist-mini" alt="实际腕部相机"></div><img id="wrist" alt="实际腕部相机操作画面">
<div id="controls"><p id="status" role="status">正在加载本作品的机械臂场景…</p>
<nav><button class="primary" id="start-policy" disabled>按说明书自动搭建</button><button id="pause" disabled>暂停</button><button id="reconnect">打开场景</button><button id="stop">关闭场景</button></nav>
<p id="capability">正在检查说明书策略。场景与说明书使用同一份模型。</p>
<details id="manual-controls"><summary>手动操作与示范采集</summary><p>每次按钮执行一个小幅关节增量；通过腕部相机观察结果。记录示范时仅显示说明书与腕部相机。</p><div id="joints"></div><nav><button id="record" disabled>开始记录示范</button><button id="save" disabled>保存示范</button></nav><p id="record-status">尚未记录示范</p></details>
</div></section></main><script type="module" src="/workspace-assets/workspace.js"></script></body></html>
